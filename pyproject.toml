[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repograph"
version = "0.1.0"
description = "AST-aware repository RAG CLI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer",
    "rich",
    "qdrant-client",
    "ollama",
    "tree-sitter",
    "tree-sitter-python",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
repograph = "repograph.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
